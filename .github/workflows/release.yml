name: Publier la version macOS vérifiée
on:
  workflow_run:
    workflows: [Installateurs de test macOS]
    types: [completed]
    branches: [main]
permissions:
  contents: write
  actions: read
concurrency:
  group: macos-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: Predictions-macOS-test-*
          merge-multiple: true
          path: release-assets
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Publier les paquets validés et le manifeste de mise à jour
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/publish-release.mjs
